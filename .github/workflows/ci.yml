name: CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check formatting and linting
        run: npm run lint
        
      - name: Typecheck
        run: npm run typecheck
        
      - name: Run unit tests with coverage
        run: npm run test:coverage
        
      - name: Build Next.js
        run: npm run build
